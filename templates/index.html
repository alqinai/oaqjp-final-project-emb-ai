<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IBM Emotion Detector</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/mywebscript.js" defer></script>
</head>
<body>
  <main>
    <h1>NLP — Emotion Detection</h1>
    <p>Enter a statement to identify its dominant emotion using IBM Watson NLP.</p>
    <label for="textToAnalyze">Text to analyze</label>
    <textarea id="textToAnalyze" rows="5" placeholder="I think I am having fun"></textarea>
    <button id="analyze" type="button">Analyze emotion</button>
    <h2>Detection result</h2>
    <output id="system_response" aria-live="polite"></output>
  </main>
</body>
</html>
